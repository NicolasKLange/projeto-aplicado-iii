# Mesmo limite da R01 (5 × 1024² bytes, igual ao MAXIMO_BYTES do leitor): acima disso, 413 aqui.
# A R01 do leitor fica como segunda barreira para quando o núcleo roda sem Spring (fn-ingestao).
spring.servlet.multipart.max-file-size=5MB
# A requisição leva uma parte só (arquivo); a folga cobre o envelope multipart.
spring.servlet.multipart.max-request-size=6MB
